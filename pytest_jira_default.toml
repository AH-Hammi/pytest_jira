# Default pytest-jira configuration values loaded by the plugin
# (introduced in issue #172: https://github.com/rhevm-qe-automation/pytest_jira/issues/172)
[default]
ssl_verification = true
marker_strategy = "open"
docs_search = true
resolved_statuses = "closed,resolved"
run_test_case = true
error_strategy = "strict"
connection_retry_total = 5
connection_retry_backoff_factor = 0.2
